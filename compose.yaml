services:
  heute:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_PUBLIC_DEMO: "false"
    ports:
      - "${HEUTE_BIND_ADDRESS:-127.0.0.1}:${HEUTE_PORT:-3000}:3000"
    volumes:
      - heute-data:/data
      - ./media/library:/data/media/library
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/api/health'); process.exit(response.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  heute-data:
