name: Version prüfen

'on':
  pull_request:
    branches: [main]

jobs:
  version-check:
    name: Version und Changelog
    runs-on: docker
    container:
      image: docker.io/library/node:24-bookworm
    timeout-minutes: 5
    steps:
      - name: PR-Stand auschecken
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.number }}/head
          path: pr
          persist-credentials: false

      - name: Aktuelles main auschecken
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: refs/heads/main
          path: main
          persist-credentials: false

      - name: Versionen vergleichen
        run: node pr/scripts/check-version.mjs pr main
