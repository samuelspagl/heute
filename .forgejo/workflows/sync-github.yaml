name: Sync main to GitHub

'on':
  workflow_dispatch:

concurrency:
  group: sync-github-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: docker
    container:
      image: docker.io/library/node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Check out current Forgejo main
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Publish changes as one GitHub commit
        env:
          SYNC_USERNAME: ${{ vars.SYNC_USERNAME }}
          SYNC_REPOSITORY: ${{ vars.SYNC_REPOSITORY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          : "${SYNC_USERNAME:?Set the Actions variable SYNC_USERNAME}"
          : "${SYNC_REPOSITORY:?Set the Actions variable SYNC_REPOSITORY (owner/repository)}"
          : "${SYNC_TOKEN:?Set the Actions secret SYNC_TOKEN}"
          if [[ ! "$SYNC_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]]; then
            echo 'SYNC_REPOSITORY must be owner/repository, without a URL or credentials.' >&2
            exit 1
          fi

          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$SYNC_USERNAME" ;;
            *Password*) printf '%s\n' "$SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$auth_dir/askpass"
          export GIT_ASKPASS="$auth_dir/askpass" GIT_TERMINAL_PROMPT=0
          export LC_ALL=C

          target="https://github.com/$SYNC_REPOSITORY.git"
          remote_ref=$(git -c credential.helper= ls-remote --refs "$target" refs/heads/main)
          expected_sha="${remote_ref%%[[:space:]]*}"
          source_tree=$(git rev-parse 'HEAD^{tree}')
          set --
          if [ -n "$expected_sha" ]; then
            git -c credential.helper= fetch --no-tags "$target" refs/heads/main
            expected_sha=$(git rev-parse FETCH_HEAD)
            if [ "$source_tree" = "$(git rev-parse "$expected_sha^{tree}")" ]; then
              echo 'GitHub main already has the current file contents; nothing to sync.'
              exit 0
            fi
            set -- -p "$expected_sha"
          fi

          export GIT_AUTHOR_NAME="$SYNC_USERNAME"
          export GIT_AUTHOR_EMAIL="$SYNC_USERNAME@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          sync_commit=$(printf 'Sync current main snapshot from Forgejo\n' \
            | git commit-tree "$source_tree" "$@")
          git -c credential.helper= push --no-follow-tags \
            --force-with-lease="refs/heads/main:$expected_sha" \
            "$target" "$sync_commit:refs/heads/main"
          printf 'Published snapshot commit %s to GitHub %s.\n' "$sync_commit" "$SYNC_REPOSITORY"
