name: App prüfen

'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  calendar-checks:
    name: Tests und Typecheck
    runs-on: docker
    container:
      image: docker.io/library/node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bun installieren
        run: npm install -g bun@1.4.4

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Alle Tests
        run: bun test

      - name: Nuxt vorbereiten
        run: bunx nuxt prepare

      - name: Typecheck
        run: bun --bun run typecheck
