<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wave" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#533448"/>
      <stop offset="1" stop-color="#71405d"/>
    </linearGradient>
  </defs>
  <path fill="#2b2031" d="M0 0h1600v1000H0z"/>
  <style>
    .drift path { transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .drift path { animation: wave-drift 22s ease-in-out infinite alternate; }
      .drift path:nth-child(even) { animation-direction: alternate-reverse; animation-duration: 28s; }
      .drift path:nth-child(3) { animation-duration: 32s; }
    }
    @keyframes wave-drift {
      from { transform: translate(-1%, -0.8%) scale(1.06); }
      to { transform: translate(1%, 0.8%) scale(1.06); }
    }
  </style>
